[package]
name = "wb-switch-core"
version = "0.1.85"
edition = "2021"
description = "wb-switch 核心逻辑（账号/切换/会话/签到/更新），不依赖 Tauri，可被桌面端与 HTTP server 复用"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# system-proxy：不显式配代理时跟随 Windows「Internet 选项」里的系统代理。
# `default-features = false` 会把它一并关掉，导致只认进程环境变量（GUI 启动时为空），
# 开了系统代理的用户也会直连失败。显式 `.proxy(..)` 仍优先（reqwest 会自动置
# auto_sys_proxy=false），所以「设置页填的代理」语义不变。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy", "stream"] }
# 更新包验签与 tauri-plugin-updater 同一套算法（minisign），版本对齐插件依赖，不引入新树。
minisign-verify = "0.2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
# backup：会话同步前用 SQLite 在线备份 API 生成一致快照，不直接 cp 活动库。
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# 会话关联的内容版本（归一化行摘要 / 全文摘要）。不能改用 DefaultHasher：跨进程
# 与跨版本都不稳定，无法作为持久化内容身份。
sha2 = "0.10"

# 整包导出/导入（备份迁移）用 zip。Cargo.lock 里已有 zip 4.6.1 与 flate2 1.1.9，
# 这里只打开 deflate 压缩 + flate2 的纯 Rust 后端（miniz_oxide）：不引入 C 依赖、
# 也不新增压缩实现。zip 的 `deflate` 特性会连带 zopfli / zlib-rs（lock 里没有），
# 故用 `deflate-flate2` 并在本 crate 显式指定 flate2 后端，保证 feature 合并后有实现。
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# CodeBuddy CN IDE Safe Storage (state.vscdb secret inject)
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# Linux 密钥环：直接按 Secret Service D-Bus 协议读 Safe Storage 密码，不依赖
# 默认不安装的 secret-tool（issue #80）。版本与 tauri 依赖图里已有的那份一致，
# 不引入新的下载。
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

