[package]
name = "wb-switch-server"
version = "0.1.85"
edition = "2021"
description = "wb-switch HTTP server + CLI（npm 安装形态：wb-switch 命令启动本地 webui）"

[[bin]]
name = "wb-switch"
path = "src/main.rs"

[dependencies]
wb-switch-core = { path = "../wb-switch-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = "1"
serde_json = "1"
# 归档接口在浏览器侧只能走 base64（webui 没有文件系统）；版本与 core 对齐。
base64 = "0.22"
# 导出的下载文件名要带日期（`wb-switch-backup-YYYYMMDD.zip`）；版本与 core 对齐。
chrono = "0.4"
# 临时目录名必须不可预测（防符号链接劫持）。
uuid = { version = "1", features = ["v4"] }
rust-embed = "8"
